###############################################################################
#  LiveTalking Configuration
#  CLI arguments override values in this file
###############################################################################

# -------- Audio ----------------------------------------------------------
l: 10
m: 8
r: 10

# -------- Avatar Model ----------------------------------------------------------
model: wav2lip                 # musetalk / wav2lip / ultralight
avatar_id: wav2lip256_avatar1
batch_size: 16

# -------- Custom Actions ----------------------------------------------------------
customvideo_config: ''

# -------- TTS ----------------------------------------------------------
tts: piper                     # offline Russian speech synthesis
REF_FILE: models/ru_RU-dmitri-medium.onnx
REF_TEXT: ''                   # exact transcript of the reference WAV for voice cloning
TTS_SERVER: ''                 # TTS server URL, no trailing slash

# -------- Microphone ASR -------------------------------------------------
ASR_BACKEND: qwen3asr
ASR_SERVER: http://127.0.0.1:8092
ASR_MODEL: Qwen/Qwen3-ASR-0.6B

# -------- LLM ----------------------------------------------------------
# Set YANDEX_AISTUDIO_KEY in the process environment or .env before using chat.
llm_provider: yandex           # dashscope / orcarouter / yandex
llm_model: ''                  # use the selected provider's default model
llm_project: b1gnot6t4gp0jj7a56du
llm_system_prompt_file: ''    # optional UTF-8 file with role, style and speaking rules

# -------- Transport ----------------------------------------------------------
transport: webrtc              # rtcpush / webrtc / rtmp / virtualcam
stun: 'stun:stun.freeswitch.org:3478'  # stun server URL
push_url: ''                   # push URL for rtcpush/rtmp (not needed for webrtc/virtualcam)
max_session: 5                 # max concurrent sessions
listenport: 8010
